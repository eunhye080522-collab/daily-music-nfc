<script>
'use strict';const START='2026-10-06',END='2027-10-31';const $=id=>document.getElementById(id);
function koreanToday(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}`;}
function render(songs,date,redirect){const i=songs.findIndex(s=>s.date===date);$('date').value=date>=START&&date<=END?date:'';if(i<0){$('result').classList.add('hidden');$('message').textContent=date<START?'391일 음악 일정은 2026년 10월 6일에 시작해요.':'391일 음악 일정이 2027년 10월 31일에 종료됐어요.';return;}
const s=songs[i];$('result').classList.remove('hidden');$('message').textContent=`${date} · 한국 시간 기준`;$('day').textContent=`${s.day}일 차 / 391일`;$('title').textContent=s.title;$('artist').textContent=s.artist;$('play').href=s.url;
// NFC로 기본 주소에 접속한 경우에만 곡 URL로 이동한다. 미리 보기 모드에서는 이동하지 않는다.
if(redirect) window.location.replace(s.url);
}
(async()=>{try{const songs=JSON.parse(document.getElementById('song-data').textContent);if(songs.length!==391)throw Error('곡 목록 수 오류');const today=koreanToday();const params=new URLSearchParams(location.search);const preview=params.get('preview')==='1';const chosen=params.get('date');const initial=chosen&&/^\d{4}-\d{2}-\d{2}$/.test(chosen)?chosen:today;render(songs,initial,!preview&&!chosen);
$('preview').addEventListener('click',()=>{if($('date').value)render(songs,$('date').value,false)});$('today').addEventListener('click',()=>render(songs,koreanToday(),false));}catch(e){$('message').textContent='곡 정보를 불러오지 못했어요. 인터넷 연결이나 웹사이트 배포 상태를 확인해 주세요.';console.error(e);}})();
</script></body></html>
